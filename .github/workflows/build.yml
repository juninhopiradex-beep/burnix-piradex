name: Build BURNIX by PIRADEX (testes + macOS VST3/AU + Windows VST3 + instaladores)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ testes DSP + integracao (Linux, sem anfitriao)
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Segredos de licenca (senhas offline)
        shell: bash
        env:
          S_B64: ${{ secrets.BURNIX_SECRETS_B64 }}
        run: |
          if [ -f Source/Shared/Secrets.h ]; then echo "Secrets.h do repositorio (so salt + hash; master rodada a 24/11/2026)"; elif [ -n "$S_B64" ]; then echo "$S_B64" | base64 -d > Source/Shared/Secrets.h; echo "Secrets.h injetado"; else echo "BURNIX_SECRETS_B64 nao definido: usa Source/Shared/Secrets.h do repositorio"; fi
      - name: Dependencias JUCE (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev xvfb
      - name: Configurar
        run: cmake -B build-tests -DBX_BUILD_TESTS=ON -DBX_BUILD_SMOKE=ON -DBX_ENABLE_LTO=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build-tests --config Release --target test_dsp BurnixSmoke -j 4
      - name: Testes DSP (C++ puro)
        run: |
          set -o pipefail
          ./build-tests/test_dsp | tee test_dsp.log
      - name: Teste de integracao do processador (JUCE)
        run: |
          set -o pipefail
          mkdir -p smoke && cd smoke
          xvfb-run -a ../build-tests/BurnixSmoke_artefacts/Release/BurnixSmoke | tee ../smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BURNIX-test-logs
          path: |
            test_dsp.log
            smoke.log
            smoke/editor_perform.png
            smoke/editor_sculpt.png
            smoke/editor_engineer.png
            smoke/editor_login.png

  # ------------------------------------------------------------------ macOS: binario universal (Intel 10.13+ e Apple Silicon)
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: pkgbuild sem verificacao de versao (a 1.0.2 instala por cima de versoes com numero maior)
        working-directory: ${{ github.workspace }}
        run: chmod +x ci/pkgbuild && echo "${{ github.workspace }}/ci" >> "$GITHUB_PATH"
      - name: Segredos de licenca (senhas offline)
        shell: bash
        env:
          S_B64: ${{ secrets.BURNIX_SECRETS_B64 }}
        run: |
          if [ -f Source/Shared/Secrets.h ]; then echo "Secrets.h do repositorio (so salt + hash; master rodada a 24/11/2026)"; elif [ -n "$S_B64" ]; then echo "$S_B64" | base64 -d > Source/Shared/Secrets.h; echo "Secrets.h injetado"; else echo "BURNIX_SECRETS_B64 nao definido: usa Source/Shared/Secrets.h do repositorio"; fi

      - name: Versao e segredos de assinatura
        run: |
          VER=$(grep -m1 -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | cut -d' ' -f2)
          echo "VER=$VER" >> $GITHUB_ENV
          if [ -n "${{ secrets.MACOS_CERTIFICATE }}" ]; then echo "HAS_SIGN=true" >> $GITHUB_ENV; else echo "HAS_SIGN=false" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then echo "HAS_NOTARIZE=true" >> $GITHUB_ENV; else echo "HAS_NOTARIZE=false" >> $GITHUB_ENV; fi

      - name: Escolher um Xcode que ainda gera binarios para macOS 10.13 (o Xcode 26 sobe o minimo para 11.0)
        run: |
          ls -d /Applications/Xcode_*.app
          X=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Nenhum Xcode 15/16 disponivel: o plugin nao correria no macOS Catalina"; exit 1; fi
          sudo xcode-select -s "$X"; xcodebuild -version

      - name: Configurar (universal x86_64 + arm64, minimo 10.13)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Compilar VST3 + AU + CLAP + Standalone (Release)
        run: cmake --build build --config Release --target Burnix_VST3 Burnix_AU Burnix_CLAP Burnix_Standalone -j 4

      - name: Recolher artefactos
        run: |
          mkdir -p out
          find build -name "*.component" -prune -exec cp -R {} out/ \;
          find build -name "*.vst3"      -prune -exec cp -R {} out/ \;
          find build -name "*.clap"      -prune -exec cp -R {} out/ \;
          find build -name "*.app"       -prune -exec cp -R {} out/ \;
          ls -la out

      - name: Verificar binarios (arquitecturas e minimo do macOS)
        run: |
          for b in "out/BURNIX by PIRADEX.vst3/Contents/MacOS/BURNIX by PIRADEX" "out/BURNIX by PIRADEX.component/Contents/MacOS/BURNIX by PIRADEX" "out/BURNIX by PIRADEX.clap/Contents/MacOS/BURNIX by PIRADEX"; do
            echo "== $b"; lipo -archs "$b"; otool -l "$b" | grep -A3 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos|version" | head -4
          done 2>&1 | tee binary-check.log
          # o x86_64 tem de abrir no macOS 10.13+ (Catalina incluido)
          X86=$(lipo "out/BURNIX by PIRADEX.vst3/Contents/MacOS/BURNIX by PIRADEX" -thin x86_64 -output /tmp/x86 && otool -l /tmp/x86 | grep -A3 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -m1 -E "minos|version" | awk '{print $2}')
          echo "minimo x86_64: $X86"; [ "$X86" = "10.13" ] || { echo "::error::minimo do macOS e $X86 (esperado 10.13)"; exit 1; }

      - name: Importar certificados (se existirem)
        if: env.HAS_SIGN == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          echo "$MACOS_CERTIFICATE" | base64 --decode > app.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import app.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          if [ -n "$MACOS_INSTALLER_CERTIFICATE" ]; then
            echo "$MACOS_INSTALLER_CERTIFICATE" | base64 --decode > inst.p12
            security import inst.p12 -k build.keychain -P "$MACOS_INSTALLER_CERTIFICATE_PWD" -T /usr/bin/productbuild
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Assinar (Developer ID se houver certificado; senao ad-hoc, necessario para arm64 carregar)
        env:
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -e
          for b in out/*.vst3 out/*.component out/*.clap out/*.app; do
            [ -e "$b" ] || continue
            if [ "$HAS_SIGN" = "true" ]; then
              codesign --force --deep --options runtime --timestamp --sign "$SIGN_ID" "$b"
            else
              codesign --force --deep --sign - "$b"
            fi
            codesign --verify --deep --strict --verbose=2 "$b"
          done

      - name: Validar o Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R "out/BURNIX by PIRADEX.component" "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i "PxBx" || true
          set +e
          auval -v aufx PxBx Prdx > auval.log 2>&1; rc=$?
          tail -40 auval.log; echo "auval exit=$rc"
          grep -q "AU VALIDATION SUCCEEDED" auval.log || { echo "::error::auval nao terminou com sucesso"; exit 1; }

      - name: pluginval (VST3, strictness 5)
        continue-on-error: true
        run: |
          curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pv.zip
          set +e
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --timeout-ms 180000 "out/BURNIX by PIRADEX.vst3" 2>&1 | tee pluginval-mac.log
          rc=${PIPESTATUS[0]}; echo "pluginval exit=$rc"; exit $rc

      - name: Zip dos plugins
        run: |
          cd out && zip -qr "../BURNIX-${VER}-macOS.zip" . -x "*.DS_Store" && cd ..
          ls -la "BURNIX-${VER}-macOS.zip"

      - name: Instalador (.pkg)
        run: |
          set -e
          mkdir -p pkgroot/vst3 pkgroot/au pkgroot/clap build-pkg
          cp -R "out/BURNIX by PIRADEX.clap"      pkgroot/clap/
          cp -R "out/BURNIX by PIRADEX.vst3"      pkgroot/vst3/
          cp -R "out/BURNIX by PIRADEX.component" pkgroot/au/
          chmod +x Packaging/macos/scripts/postinstall
          pkgbuild --identifier com.beatfreak.burnix.vst3 --version "$VER" --install-location "/Library/Audio/Plug-Ins/VST3" --root pkgroot/vst3 build-pkg/vst3.pkg
          pkgbuild --identifier com.beatfreak.burnix.au   --version "$VER" --install-location "/Library/Audio/Plug-Ins/Components" --scripts Packaging/macos/scripts --root pkgroot/au build-pkg/au.pkg
          pkgbuild --identifier com.beatfreak.burnix.clap --version "$VER" --install-location "/Library/Audio/Plug-Ins/CLAP" --root pkgroot/clap build-pkg/clap.pkg
          SIGN_ARGS=""
          if [ "$HAS_SIGN" = "true" ] && [ -n "${{ secrets.MACOS_INSTALLER_IDENTITY }}" ]; then SIGN_ARGS="--sign ${{ secrets.MACOS_INSTALLER_IDENTITY }}"; fi
          productbuild --distribution Packaging/macos/Distribution.xml --package-path build-pkg --resources Packaging/macos/resources $SIGN_ARGS "BURNIX-${VER}-macOS.pkg"
          ls -la "BURNIX-${VER}-macOS.pkg"

      - name: Instaladores separados (Mac Intel antigo 10.13+ e Mac Apple Silicon)
        env:
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -e
          for ARCH in x86_64 arm64; do
            if [ "$ARCH" = "x86_64" ]; then TAG="Intel-macOS10.13"; else TAG="AppleSilicon"; fi
            R="thin-$ARCH"; mkdir -p "$R/vst3" "$R/au" "$R/clap" "$R/pkg"
            cp -R "out/BURNIX by PIRADEX.vst3" "$R/vst3/"; cp -R "out/BURNIX by PIRADEX.component" "$R/au/"; cp -R "out/BURNIX by PIRADEX.clap" "$R/clap/"
            for B in "$R/vst3/BURNIX by PIRADEX.vst3" "$R/au/BURNIX by PIRADEX.component" "$R/clap/BURNIX by PIRADEX.clap"; do
              BIN="$B/Contents/MacOS/BURNIX by PIRADEX"
              lipo "$BIN" -thin "$ARCH" -output "$BIN.thin" && mv "$BIN.thin" "$BIN"
              if [ "$HAS_SIGN" = "true" ]; then codesign --force --deep --options runtime --timestamp --sign "$SIGN_ID" "$B"; else codesign --force --deep --sign - "$B"; fi
              codesign --verify --deep --strict "$B"
              echo "== $ARCH: $(lipo -archs "$BIN") minimo: $(otool -l "$BIN" | grep -A3 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | grep -m1 -E 'minos|version' | awk '{print $2}')"
            done
            pkgbuild --identifier com.beatfreak.burnix.vst3 --version "$VER" --install-location "/Library/Audio/Plug-Ins/VST3" --root "$R/vst3" "$R/pkg/vst3.pkg"
            pkgbuild --identifier com.beatfreak.burnix.au   --version "$VER" --install-location "/Library/Audio/Plug-Ins/Components" --scripts Packaging/macos/scripts --root "$R/au" "$R/pkg/au.pkg"
            pkgbuild --identifier com.beatfreak.burnix.clap --version "$VER" --install-location "/Library/Audio/Plug-Ins/CLAP" --root "$R/clap" "$R/pkg/clap.pkg"
            sed "s/hostArchitectures=\"x86_64,arm64\"/hostArchitectures=\"$ARCH\"/" Packaging/macos/Distribution.xml > "$R/Distribution.xml"
            SIGN_ARGS=""
            if [ "$HAS_SIGN" = "true" ] && [ -n "${{ secrets.MACOS_INSTALLER_IDENTITY }}" ]; then SIGN_ARGS="--sign ${{ secrets.MACOS_INSTALLER_IDENTITY }}"; fi
            productbuild --distribution "$R/Distribution.xml" --package-path "$R/pkg" --resources Packaging/macos/resources $SIGN_ARGS "BURNIX-${VER}-macOS-${TAG}.pkg"
          done
          ls -la BURNIX-*-macOS*.pkg

      - name: Notarizar (so com credenciais Apple)
        if: env.HAS_NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -e
          xcrun notarytool submit "BURNIX-${VER}-macOS.pkg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "BURNIX-${VER}-macOS.pkg"

      - name: AAX (Pro Tools) - compilar, assinar e empacotar
        env:
          PACE_ACCOUNT: ${{ secrets.PACE_ACCOUNT }}
          PACE_PASSWORD: ${{ secrets.PACE_PASSWORD }}
          PACE_WCGUID: ${{ secrets.PACE_WCGUID }}
          PACE_EDEN_URL: ${{ secrets.PACE_EDEN_URL }}
        run: |
          set -e
          cmake --build build --config Release --target Burnix_AAX -- -quiet
          A=$(find build -name "*.aaxplugin" -type d -prune | head -1)
          [ -n "$A" ] || { echo "::error::AAX nao encontrado"; exit 1; }
          rm -rf aax-out && mkdir -p aax-out && cp -R "$A" aax-out/
          B="aax-out/$(basename "$A")"
          lipo -archs "$B/Contents/MacOS/"*
          codesign --force --deep -s - "$B"
          SUF=nao-assinado
          if [ -n "$PACE_ACCOUNT" ] && [ -n "$PACE_EDEN_URL" ]; then
            curl -sSL -o eden.dmg "$PACE_EDEN_URL"
            hdiutil attach -nobrowse -mountpoint /Volumes/Eden eden.dmg
            sudo installer -pkg /Volumes/Eden/*.pkg -target /
            W="/Applications/PACEAntiPiracy/Eden/Fusion/Current/bin/wraptool"
            "$W" sign --verbose --account "$PACE_ACCOUNT" --password "$PACE_PASSWORD" --wcguid "$PACE_WCGUID" --dsig1-compat off --in "$B" --out "$B"
            "$W" verify --verbose --in "$B"
            SUF=assinado
          fi
          cp LEIA-ME-AAX.txt aax-out/
          V=$(grep -m1 -oE 'project\([^)]*VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$')
          ditto -c -k --sequesterRsrc aax-out "BURNIX-$V-macOS-AAX-$SUF.zip"
          ls -la *-AAX-*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BURNIX-macOS
          path: |
            BURNIX-*-macOS*.pkg
            BURNIX-*-macOS.zip
            BURNIX-*-AAX-*.zip
            binary-check.log
            auval.log
            pluginval-mac.log

  # ------------------------------------------------------------------ Windows x64
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Segredos de licenca (senhas offline)
        shell: bash
        env:
          S_B64: ${{ secrets.BURNIX_SECRETS_B64 }}
        run: |
          if [ -f Source/Shared/Secrets.h ]; then echo "Secrets.h do repositorio (so salt + hash; master rodada a 24/11/2026)"; elif [ -n "$S_B64" ]; then echo "$S_B64" | base64 -d > Source/Shared/Secrets.h; echo "Secrets.h injetado"; else echo "BURNIX_SECRETS_B64 nao definido: usa Source/Shared/Secrets.h do repositorio"; fi
      - name: Caminhos longos
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Versao
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)' | Select-Object -First 1
          "VER=$($m.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configurar
        shell: pwsh
        run: |
          cmake -B C:/b -A x64 2>&1 | Tee-Object -FilePath win-configure.log
          exit $LASTEXITCODE
      - name: Compilar VST3 + CLAP + Standalone (Release)
        shell: pwsh
        run: |
          cmake --build C:/b --config Release --target Burnix_VST3 Burnix_CLAP Burnix_Standalone 2>&1 | Tee-Object -Append -FilePath win-configure.log
          exit $LASTEXITCODE
      - name: Recolher VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $vst3 = Get-ChildItem -Path C:/b -Recurse -Directory -Filter "BURNIX by PIRADEX.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "VST3 nao encontrado" }
          Copy-Item -Recurse -Force $vst3.FullName "out\BURNIX by PIRADEX.vst3"
          $clap = Get-ChildItem -Path C:/b -Recurse -File -Filter "BURNIX by PIRADEX.clap" | Select-Object -First 1
          if (-not $clap) { throw "CLAP nao encontrado" }
          Copy-Item -Force $clap.FullName "out\BURNIX by PIRADEX.clap"
          $exe = Get-ChildItem -Path C:/b -Recurse -File -Filter "BURNIX by PIRADEX.exe" | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName "out\BURNIX by PIRADEX (Standalone).exe" }
          Get-ChildItem -Recurse out | Select-Object FullName, Length
      - name: pluginval (VST3, strictness 5)
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pv.zip
          Expand-Archive pv.zip -DestinationPath pv
          & .\pv\pluginval.exe --strictness-level 5 --validate-in-process --timeout-ms 180000 "out\BURNIX by PIRADEX.vst3" 2>&1 | Tee-Object -FilePath pluginval-win.log
          exit $LASTEXITCODE
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out\* -DestinationPath "BURNIX-$env:VER-Windows.zip"
      - name: Instalador (.exe, Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DVST3SRC=$PWD\out\BURNIX by PIRADEX.vst3" "/DCLAPSRC=$PWD\out\BURNIX by PIRADEX.clap" "/DOUTDIR=$PWD" Packaging\windows\BURNIX.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem BURNIX-*-Setup.exe
      - name: AAX (Pro Tools) - compilar e empacotar
        shell: pwsh
        env:
          PACE_ACCOUNT: ${{ secrets.PACE_ACCOUNT }}
          PACE_PASSWORD: ${{ secrets.PACE_PASSWORD }}
          PACE_WCGUID: ${{ secrets.PACE_WCGUID }}
          PACE_EDEN_WIN_URL: ${{ secrets.PACE_EDEN_WIN_URL }}
          PACE_KEYFILE_B64: ${{ secrets.PACE_KEYFILE_B64 }}
          PACE_KEYPASSWORD: ${{ secrets.PACE_KEYPASSWORD }}
        run: |
          cmake --build C:/b --config Release --target Burnix_AAX
          if ($LASTEXITCODE -ne 0) { throw "AAX falhou a compilar" }
          $bin = Get-ChildItem -Path C:/b -Recurse -File -Filter "*.aaxplugin" | Where-Object { $_.FullName -match '\\Contents\\x64\\' -and $_.Length -gt 100000 } | Select-Object -First 1
          if (-not $bin) { throw "AAX nao encontrado" }
          $a = $bin.Directory.Parent.Parent          # pasta .aaxplugin (Contents\x64\<binario>)
          Write-Host "AAX: $($a.FullName) ($([int]($bin.Length/1KB)) KB)"
          $suf = "nao-assinado"
          if ($env:PACE_ACCOUNT -and $env:PACE_EDEN_WIN_URL) {
            Invoke-WebRequest -Uri $env:PACE_EDEN_WIN_URL -OutFile eden.exe
            Start-Process -Wait -FilePath .\eden.exe -ArgumentList "/quiet"
            [IO.File]::WriteAllBytes("pace.p12", [Convert]::FromBase64String($env:PACE_KEYFILE_B64))
            $wrap = Get-ChildItem "${env:ProgramFiles(x86)}\PACEAntiPiracy" -Recurse -Filter wraptool.exe | Select-Object -First 1
            & $wrap.FullName sign --verbose --account $env:PACE_ACCOUNT --password $env:PACE_PASSWORD --wcguid $env:PACE_WCGUID `
              --keyfile pace.p12 --keypassword $env:PACE_KEYPASSWORD --in $a.FullName --out $a.FullName
            if ($LASTEXITCODE -ne 0) { throw "wraptool falhou" }
            Remove-Item pace.p12
            $suf = "assinado"
          }
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\([^)]*VERSION ([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          Remove-Item -Recurse -Force aax-zip -ErrorAction SilentlyContinue; New-Item -ItemType Directory aax-zip | Out-Null
          Copy-Item -Recurse -Force $a.FullName aax-zip\ ; Copy-Item LEIA-ME-AAX.txt aax-zip\
          Push-Location aax-zip; 7z a -tzip "..\BURNIX-$v-Windows-AAX-$suf.zip" * | Out-Null; Pop-Location
          if ((Get-Item "BURNIX-$v-Windows-AAX-$suf.zip").Length -lt 200000) { throw "zip do AAX vazio" }
          Get-ChildItem *-AAX-*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BURNIX-Windows
          path: |
            pluginval-win.log
            BURNIX-*-Windows-Setup.exe
            BURNIX-*-Windows.zip
            BURNIX-*-AAX-*.zip
            win-configure.log

  # ------------------------------------------------------------------ release com checksums
  release:
    needs: [ tests, macos, windows ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: BURNIX-macOS, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: BURNIX-Windows, path: dist }
      - name: Checksums e notas
        run: |
          VER=$(grep -m1 -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | cut -d' ' -f2)
          echo "VER=$VER" >> $GITHUB_ENV
          cd dist && rm -f *.log && sha256sum BURNIX-* > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          {
            echo "BURNIX by PIRADEX v$VER (commit ${GITHUB_SHA::7})"
            echo
            echo "- macOS Intel (Macs antigos, macOS 10.13+ incluindo Catalina): BURNIX-$VER-macOS-Intel-macOS10.13.pkg"
            echo "- macOS Apple Silicon (M1/M2/M3/M4): BURNIX-$VER-macOS-AppleSilicon.pkg"
            echo "- macOS universal (os dois num so): BURNIX-$VER-macOS.pkg e .zip para instalacao manual"
            echo "- Windows: BURNIX-$VER-Windows-Setup.exe (VST3 x64) e .zip"
            echo "- Binarios NAO notarizados/assinados com Developer ID/Authenticode, a menos que as credenciais estejam configuradas (ver Packaging/SIGNING.md)"
            echo "- AAX (Pro Tools): ficheiros *-AAX-*.zip (ver LEIA-ME-AAX.txt). Sem assinatura PACE so abre no Pro Tools Developer."
            echo "- PRD, funcionalidades e limites: Docs/PRD.md · Resultados de testes: Docs/TEST_RESULTS.md"
          } > RELEASE_NOTES.md
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: BURNIX by PIRADEX v${{ env.VER }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/BURNIX-*
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
